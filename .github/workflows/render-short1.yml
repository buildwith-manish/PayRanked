name: Render Short 1

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to render'
        required: true
        default: 'feat/short-1-vertical'
      variant:
        description: 'End card: youtube = Related video button; social = Facebook, link in comments; instagram = link in bio'
        required: true
        default: youtube
        type: choice
        options: [youtube, social, instagram]

jobs:
  render-chunk:
    env:
      COMP_SUFFIX: ${{ inputs.variant == 'social' && '-Social' || inputs.variant == 'instagram' && '-Instagram' || '' }}
      FILE_SUFFIX: ${{ inputs.variant == 'social' && '-social' || inputs.variant == 'instagram' && '-instagram' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Calculate frame range
        id: range
        run: |
          TOTAL=2304
          CHUNKS=4
          CHUNK=${{ matrix.chunk }}
          PER_CHUNK=$(( (TOTAL + CHUNKS - 1) / CHUNKS ))
          START=$(( (CHUNK - 1) * PER_CHUNK ))
          END=$(( START + PER_CHUNK - 1 ))
          if [ "$END" -ge "$TOTAL" ]; then END=$((TOTAL - 1)); fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "Chunk $CHUNK: frames $START-$END"

      - name: Render Short 1 chunk
        run: |
          mkdir -p out
          npx remotion render src/index.ts "Short1-Vertical${COMP_SUFFIX}" "out/chunk-${{ matrix.chunk }}.mp4" \
            --frames=${{ steps.range.outputs.start }}-${{ steps.range.outputs.end }} \
            --codec=h264 \
            --crf=16 \
            --x264-preset=slow \
            --audio-codec=aac \
            --audio-bitrate=320k \
            --scale=1 \
            --concurrency=4 \
            --color-space=bt709 \
            --log=error

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: short1-chunk-${{ matrix.chunk }}
          path: out/chunk-${{ matrix.chunk }}.mp4
          retention-days: 7

  concatenate:
    env:
      COMP_SUFFIX: ${{ inputs.variant == 'social' && '-Social' || inputs.variant == 'instagram' && '-Instagram' || '' }}
      FILE_SUFFIX: ${{ inputs.variant == 'social' && '-social' || inputs.variant == 'instagram' && '-instagram' || '' }}
    needs: render-chunk
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download rendered chunks
        uses: actions/download-artifact@v4
        with:
          pattern: short1-chunk-*
          path: out/chunks
          merge-multiple: true

      - name: Concatenate chunks
        run: |
          for i in 1 2 3 4; do
            test -s "out/chunks/chunk-$i.mp4"
            echo "file 'out/chunks/chunk-$i.mp4'" >> concat.txt
          done
          mkdir -p out
          ffmpeg -y -v error -f concat -safe 0 -i concat.txt \
            -c:v copy -c:a aac -b:a 320k -movflags +faststart \
            out/short-1-vertical$FILE_SUFFIX.mp4

      - name: Validate output
        run: |
          ffprobe -v error \
            -show_entries stream=width,height,r_frame_rate \
            -show_entries format=duration \
            -of default=nw=1 \
            out/short-1-vertical$FILE_SUFFIX.mp4

      - name: Upload rendered Short 1
        uses: actions/upload-artifact@v4
        with:
          name: short-1-vertical${{ env.FILE_SUFFIX }}
          path: out/short-1-vertical${{ env.FILE_SUFFIX }}.mp4
          retention-days: 7
