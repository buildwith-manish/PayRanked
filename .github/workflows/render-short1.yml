name: Render Short 1

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to render'
        required: true
        default: 'feat/short-1-vertical'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render Short 1
        run: |
          mkdir -p out
          npx remotion render src/index.ts Short1-Vertical out/short-1-vertical.mp4 \
            --codec=h264 \
            --crf=16 \
            --x264-preset=slow \
            --audio-codec=aac \
            --audio-bitrate=320k \
            --scale=1 \
            --concurrency=4 \
            --color-space=bt709 \
            --log=error

      - name: Validate output
        run: |
          ffprobe -v error \
            -show_entries stream=width,height,r_frame_rate \
            -show_entries format=duration \
            -of default=nw=1 \
            out/short-1-vertical.mp4

      - name: Upload rendered Short 1
        uses: actions/upload-artifact@v4
        with:
          name: short-1-vertical
          path: out/short-1-vertical.mp4
          retention-days: 7
