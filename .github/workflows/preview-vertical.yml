name: Preview vertical Shorts (stills)
# Renders a handful of key frames of every vertical Short so the 9:16 layouts can be checked in a couple of minutes,
# without rendering the full videos. Download the "vertical-stills-*" artifacts and look at the PNGs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to render
        required: true
        default: feat/short-1-vertical
jobs:
  stills:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # composition : seconds into the Short (the Short runs at 60 fps, so frame = seconds * 60)
          - {comp: Short1-Vertical, seconds: '1.5 4 8 12 16 21 24.5 26 27.5 28.5 29.5 31 33 36 40 41.2 42 42.6 42.9 43.0 43.4 43.9 44.6'}
          - {comp: Short2-Vertical, seconds: '0.4 0.9 1.3 1.6 1.9 2.4 3.2 5 9 14 20 26 33 46 52 56 57.3 58.2 58.9'}
          - {comp: Short3-Vertical, seconds: '0.4 0.9 1.3 1.6 1.9 2.4 3.2 5 9 14 20 26 34 41 42.3 43.2 43.9'}
          - {comp: Short4-Vertical, seconds: '0.4 0.9 1.3 1.6 1.9 2.4 3.2 5 9 14 20 26 34 44 51 52.3 53.2 53.9'}
          - {comp: Short5-Vertical, seconds: '0.4 0.9 1.3 1.6 1.9 2.4 3.2 5 9 14 20 26 34 41 42.3 43.2 43.9'}
          - {comp: Short6-Vertical, seconds: '1 3 7 11 15 18 21.3 22.2 22.9'}
          - {comp: Short7-Vertical, seconds: '0.4 0.9 1.3 1.6 1.9 2.4 3.2 8 11 12.5 14 18 21 24 24.3 25.2 25.9'}
          - {comp: Short1-Vertical-Social, seconds: '41.2 43 44.6'}
          - {comp: Short3-Vertical-Social, seconds: '41 42.5 43.9'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.ref }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - name: Render stills
        run: |
          mkdir -p out/stills
          for s in ${{ matrix.seconds }}; do
            frame=$(python3 -c "print(round($s * 60))")
            npx remotion still src/index.ts "${{ matrix.comp }}" "out/stills/${{ matrix.comp }}-t${s}s.png" --frame="$frame" --scale=1 --log=error
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vertical-stills-${{ matrix.comp }}
          path: out/stills/*.png
