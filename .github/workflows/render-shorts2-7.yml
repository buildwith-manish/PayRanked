name: Render Shorts 2-7

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to render'
        required: true
        default: 'feat/short-1-vertical'

jobs:
  render-chunk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        short: [2, 3, 4, 5, 6, 7]
        chunk: [1, 2, 3, 4]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Calculate frame range
        id: range
        run: |
          case "${{ matrix.short }}" in
            2) TOTAL=3300 ;;
            3) TOTAL=2400 ;;
            4) TOTAL=3000 ;;
            5) TOTAL=2400 ;;
            6) TOTAL=1800 ;;
            7) TOTAL=2700 ;;
          esac
          CHUNKS=4
          CHUNK=${{ matrix.chunk }}
          PER_CHUNK=$(( (TOTAL + CHUNKS - 1) / CHUNKS ))
          START=$(( (CHUNK - 1) * PER_CHUNK ))
          END=$(( START + PER_CHUNK - 1 ))
          if [ "$END" -ge "$TOTAL" ]; then END=$((TOTAL - 1)); fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Render chunk
        run: |
          mkdir -p out
          npx remotion render src/index.ts "Short${{ matrix.short }}-Vertical" \
            "out/short${{ matrix.short }}-chunk-${{ matrix.chunk }}.mp4" \
            --frames=${{ steps.range.outputs.start }}-${{ steps.range.outputs.end }} \
            --codec=h264 \
            --crf=16 \
            --x264-preset=slow \
            --audio-codec=aac \
            --audio-bitrate=320k \
            --scale=1 \
            --concurrency=4 \
            --color-space=bt709 \
            --log=error

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: short${{ matrix.short }}-chunk-${{ matrix.chunk }}
          path: out/short${{ matrix.short }}-chunk-${{ matrix.chunk }}.mp4
          retention-days: 7

  concatenate:
    needs: render-chunk
    runs-on: ubuntu-latest
    strategy:
      matrix:
        short: [2, 3, 4, 5, 6, 7]
    steps:
      - name: Download chunks
        uses: actions/download-artifact@v4
        with:
          pattern: short${{ matrix.short }}-chunk-*
          path: out/chunks
          merge-multiple: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Concatenate Short ${{ matrix.short }}
        run: |
          : > concat.txt
          for i in 1 2 3 4; do
            test -s "out/chunks/short${{ matrix.short }}-chunk-$i.mp4"
            echo "file 'out/chunks/short${{ matrix.short }}-chunk-$i.mp4'" >> concat.txt
          done
          mkdir -p out
          ffmpeg -y -v error -f concat -safe 0 -i concat.txt \
            -c:v copy -c:a aac -b:a 320k -movflags +faststart \
            "out/short${{ matrix.short }}-vertical.mp4"

      - name: Validate output
        run: |
          ffprobe -v error \
            -show_entries stream=width,height,r_frame_rate \
            -show_entries format=duration \
            -of default=nw=1 \
            "out/short${{ matrix.short }}-vertical.mp4"

      - name: Upload Short ${{ matrix.short }}
        uses: actions/upload-artifact@v4
        with:
          name: short${{ matrix.short }}-vertical
          path: out/short${{ matrix.short }}-vertical.mp4
          retention-days: 7
