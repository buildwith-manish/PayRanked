name: Render Short 2
# Renders the body once and the three end cards (YouTube, Facebook, Instagram) separately, then joins them: see render-short-reusable.yml.
# Run it from the feat/short-1-vertical branch ("Use workflow from"), so this version of the workflow is the one that runs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to render
        required: true
        default: feat/short-1-vertical
      variants:
        description: 'Which versions: all = YouTube + Facebook + Instagram; or just one'
        required: true
        default: all
        type: choice
        options: [all, youtube, social, instagram]

jobs:
  render:
    uses: ./.github/workflows/render-short-reusable.yml
    with:
      short: 2
      ref: ${{ inputs.ref }}
      variants: ${{ inputs.variants }}
